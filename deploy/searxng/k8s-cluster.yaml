apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-config
  namespace: nodeskclaw-staging
data:
  settings.yml: |
    use_default_settings: true

    general:
      instance_name: "SearXNG"

    search:
      formats:
        - html
        - json

    engines:
      - name: baidu
        disabled: false
      - name: bing
        disabled: false
      - name: 360search
        disabled: false
      - name: mojeek
        disabled: false
      - name: mwmbl
        disabled: false
      - name: sogou
        disabled: false
      - name: yandex
        disabled: false
      - name: google
        disabled: true
      - name: duckduckgo
        disabled: true
      - name: startpage
        disabled: true
      - name: brave
        disabled: true
      - name: wikipedia
        disabled: true

    server:
      base_url: "http://searxng-web.nodeskclaw-staging.svc.cluster.local:8080"
      bind_address: "0.0.0.0"
      port: 8080
      secret_key: "CHANGE_ME_SEARXNG_SECRET"
      limiter: false
      public_instance: false
      image_proxy: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: nodeskclaw-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      containers:
        - name: valkey
          image: <LAN_IP>:5000/valkey:9-alpine
          args:
            - valkey-server
            - --save
            - "30"
            - "1"
            - --loglevel
            - warning
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: nodeskclaw-staging
spec:
  selector:
    app: valkey
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: nodeskclaw-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      containers:
        - name: searxng
          image: <LAN_IP>:5000/searxng:latest
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/searxng
            - name: cache
              mountPath: /var/cache/searxng
      volumes:
        - name: config
          configMap:
            name: searxng-config
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: searxng-web
  namespace: nodeskclaw-staging
spec:
  selector:
    app: searxng
  ports:
    - name: http
      port: 8080
      targetPort: 8080
